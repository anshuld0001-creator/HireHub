{% extends "base.html" %}
{% block title %}Login - HireHub{% endblock %}

{% block content %}
<div class="container">
  <div class="card auth-card p-4 p-md-5">
    <div class="text-center mb-4">
      <i class="bi bi-briefcase-fill text-primary fs-1"></i>
      <h3 class="fw-bold mt-2">Welcome Back</h3>
      <p class="text-muted">Login to your HireHub account</p>
    </div>
    <form action="" method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label for="email" class="form-label">Email address</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="john@example.com" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary w-100 py-2">Login</button>
    </form>
    <p class="text-center text-muted mt-4 mb-0 small">
      Don't have an account? <a href="{% url 'register' %}" class="text-decoration-none">Register here</a>
    </p>
  </div>
</div>
{% endblock %}
